name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Retried because this is the one step that depends on reaching
      # pub.dev, and hosted runners hit transient socket errors there
      # ("Got socket error trying to find package ... at https://pub.dev")
      # that fail the whole run for reasons unrelated to the commit. pub's
      # own internal retries give up after ~3 minutes; a fresh attempt
      # after a short wait clears it.
      - name: flutter pub get
        run: |
          for attempt in 1 2 3; do
            flutter pub get && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::flutter pub get failed (attempt $attempt/3), retrying in 15s"
              sleep 15
            fi
          done
          echo "::error::flutter pub get failed after 3 attempts"
          exit 1

      - run: flutter analyze

      - run: flutter test

  functions:
    name: Cloud Functions lint, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
